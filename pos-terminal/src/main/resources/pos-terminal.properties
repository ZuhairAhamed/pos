server.base-url=http://localhost:8080
terminal.id=T01
store.id=S01
# Fallback refresh cadence for the floor map. Live updates arrive via the /ws/floor WebSocket;
# this slow poll only self-heals a dropped socket and keeps the dwell timer ticking.
poll.interval.seconds=45
# Server→terminal live push. When false, the floor map relies on the fallback poll alone.
realtime.enabled=true
realtime.path=/ws/floor
# When true, the total-bar pulse degrades to a static highlight (no animation).
ui.reduced-motion=false
# Tables whose label starts with this prefix are takeaway counters (kept off the dine-in grid).
dining.takeaway.label-prefix=Counter 
# An open order past this many minutes shows a "long open" attention badge on the table map.
dining.dwell.attention.minutes=45
