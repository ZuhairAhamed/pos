spring:
  datasource:
    # SQLite is single-writer. pool=1 serialises ALL database access onto one connection, so the
    # many async @ApplicationModuleListener threads (inventory, cashdrawer, sync, audit, ...) queue
    # rather than contend — the stable pre-audit strategy (see commit b4908c3). Login auditing works
    # under pool=1 because AuthService is non-transactional: its audit write (REQUIRES_NEW) needs only
    # one connection, held by nothing else at that moment. Do NOT raise this to 2 without re-checking
    # the full e2e suite — pool=2 un-serialises the listeners and deadlocks shared-cache SQLite.
    #
    # WAL + busy_timeout are harmless here (WAL is ignored for mode=memory) and remain as good hygiene
    # for a production file override (POS_DB_URL=jdbc:sqlite:file:/var/lib/pos/pos.db): the PRAGMA in
    # connection-init-sql applies to every physical connection regardless of the URL.
    url: ${POS_DB_URL:jdbc:sqlite:file:pos?mode=memory&cache=shared&journal_mode=WAL}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA busy_timeout=5000"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: false
