spring:
  application:
    name: pos
  main:
    banner-mode: "off"
  profiles:
    default: embedded
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

pos:
  auth:
    jwt:
      secret: ${POS_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      ttl-minutes: ${POS_JWT_TTL:720}
