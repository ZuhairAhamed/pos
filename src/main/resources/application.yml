spring:
  application:
    name: pos
  main:
    banner-mode: "off"
  profiles:
    default: embedded
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  modulith:
    events:
      republish-outstanding-publications-on-restart: true

pos:
  auth:
    jwt:
      secret: ${POS_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      ttl-minutes: ${POS_JWT_TTL:720}
  inventory:
    reorder-level: ${POS_INVENTORY_REORDER_LEVEL:0}
  sync:
    erp:
      scheduled: ${POS_SYNC_ERP_SCHEDULED:false}
      fixed-delay-ms: ${POS_SYNC_ERP_DELAY_MS:60000}
      upload:
        scheduled: ${POS_SYNC_ERP_UPLOAD_SCHEDULED:false}
        fixed-delay-ms: ${POS_SYNC_ERP_UPLOAD_DELAY_MS:30000}
        min-age-ms: ${POS_SYNC_ERP_UPLOAD_MIN_AGE_MS:10000}
  notification:
    stuck-upload:
      scheduled: ${POS_NOTIFICATION_STUCK_UPLOAD_SCHEDULED:false}
      fixed-delay-ms: ${POS_NOTIFICATION_STUCK_UPLOAD_DELAY_MS:60000}
      min-age-ms: ${POS_NOTIFICATION_STUCK_UPLOAD_MIN_AGE_MS:300000}
