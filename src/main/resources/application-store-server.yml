pos:
  sync:
    erp:
      scheduled: true
      upload:
        scheduled: true
  notification:
    stuck-upload:
      scheduled: true

spring:
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://localhost:5432/pos}
    username: ${POS_DB_USER:pos}
    password: ${POS_DB_PASSWORD:pos}
    hikari:
      # Required by the reporting module's raw JdbcTemplate queries: hibernate.default_schema
      # below only scopes JPQL/HQL, NOT raw JDBC, which would otherwise hit the default `public`
      # schema and fail with "relation \"sale\" does not exist". Do not remove — it looks
      # redundant next to flyway/hibernate schema config but is the only thing scoping native SQL.
      connection-init-sql: "SET search_path TO pos"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pos
  flyway:
    enabled: true
    schemas: pos
    default-schema: pos
    create-schemas: true
    locations: classpath:db/migration/configuration,classpath:db/migration/auth,classpath:db/migration/product,classpath:db/migration/inventory,classpath:db/migration/integration,classpath:db/migration/cart,classpath:db/migration/payment,classpath:db/migration/sales,classpath:db/migration/cashdrawer,classpath:db/migration/shift,classpath:db/migration/events,classpath:db/migration/audit,classpath:db/migration/customer,classpath:db/migration/dining,classpath:db/migration/menu,classpath:db/migration/kitchen
